<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
  <title>M2.5 白盒渲染 · 永夜收租人</title>
  <!-- 内联样式与 config/theme.json tokens 同步（M2.5 功能点1，scripts/check-theme.mjs 断言色值合规）：
       bg_night=#0B1020 / text_secondary=#8892B0 / panel_stroke=#2A3555 -->
  <style>
    /* tokens: bg_night=#0B1020 / text_secondary=#8892B0 / panel_stroke=#2A3555（check-theme 断言） */
    @font-face {
      font-family: 'SourceHanSansCN-Bold';
      src: url('./fonts/SourceHanSansCN-Bold.subset.woff2') format('woff2');
      font-weight: 700; font-display: block;
    }
    @font-face {
      font-family: 'BebasNeue';
      src: url('./fonts/BebasNeue.subset.woff2') format('woff2');
      font-weight: 400; font-display: block;
    }
    body { background: #0B1020; color: #8892B0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 12px; }
    #fps { font-size: 14px; margin-bottom: 6px; }
    canvas { border: 1px solid #2A3555; }
    p { font-size: 12px; max-width: 400px; }
  </style>
</head>
<body>
  <div id="fps">FPS 采样中…</div>
  <canvas id="stage" width="750" height="1624" style="width: 375px; height: 812px;"></canvas>
  <p>M2.5 白盒渲染：主界面风格化（§3.1 线框：HUD/资源栏/剖面楼栋/dock 四键/事件卡入口），

     控制台执行 __fpsReport() 可导出帧率报告（性能预算：min ≥50fps）。</p>
  <script src="./bundle.js"></script>
