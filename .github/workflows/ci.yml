name: ci
on:
  push:
    branches: ["main", "m1/**", "m2/**", "m2p5/**", "m3/**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/check-config.mjs
      - run: npm run check:theme
      - run: npm run check:ui
      - run: npm run verify -- --design
      - run: npm run depgraph -- --check
      - run: npm run sync:cocos && npm run sync:cocos:check
